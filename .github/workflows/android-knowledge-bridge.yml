name: Android Knowledge Bridge APK

on:
  push:
    branches:
      - main
    paths:
      - "omega-mobile/android-knowledge-bridge/**"
      - ".github/workflows/android-knowledge-bridge.yml"
  pull_request:
    paths:
      - "omega-mobile/android-knowledge-bridge/**"
      - ".github/workflows/android-knowledge-bridge.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: omega-mobile/android-knowledge-bridge
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OMEGA-Knowledge-Bridge-APK
          path: omega-mobile/android-knowledge-bridge/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
