name: Apply OMEGA v21 sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v21.yml'
      - 'updates/v21.patch.part-*.b64'
      - 'updates/apply-v21.py'

permissions:
  contents: write

jobs:
  sync-v21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconstruct v21 patch
        run: cat updates/v21.patch.part-*.b64 | base64 -d | gzip -d > updates/v21.patch
      - name: Apply v21 source delta and lineage metadata
        run: python3 updates/apply-v21.py
      - name: Install MCP dependencies
        working-directory: omega/mcp/omega-control-plane
        run: npm install --ignore-scripts
      - name: Test OMEGA MCP v21
        working-directory: omega/mcp/omega-control-plane
        run: npm test
      - name: Validate package
        run: python3 omega/scripts/validate_package.py
      - name: Remove one-shot updater
        run: rm -f updates/v21.patch updates/v21.patch.part-*.b64 updates/apply-v21.py .github/workflows/apply-v21.yml
      - name: Commit synchronized v21
        run: |
          git config user.name "OMEGA Thor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: sync OMEGA v21 Freyr cloud funding and onboarding"
          git push origin HEAD:main
