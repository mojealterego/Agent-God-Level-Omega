name: OMEGA All-Repository Source Audit
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-all-repo-audit-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false
jobs:
  catalog:
    if: github.repository == 'mojealterego/Agent-God-Level-Omega' && (github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[OMEGA-REPO-AUDIT] ')))
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0,1,2,3,4,5]
    steps:
      - name: Checkout pinned source catalog and scanner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            references/github-mojealterego-589-repositories-2026-10-10.json
            scripts/omega_repository_audit.py
            tests/test_omega_repository_audit.py
      - name: Verify classification and shard integrity
        run: python3 -m unittest discover -s tests -p test_omega_repository_audit.py -v
      - name: Audit repository trees (read-only; source does not execute)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/omega_repository_audit.py --shard "$SHARD" --shards 6 --out "dist/repo-source-audit-$SHARD.json"
      - name: Publish source evidence without claiming runtime activation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-repositories-shard-${{ matrix.shard }}
          path: dist/repo-source-audit-*.json
          if-no-files-found: error
          retention-days: 30
