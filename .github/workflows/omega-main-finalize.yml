name: OMEGA Historical Branch Preservation Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omega-main-finalize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert all restored branches remain accessible at original commits
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          python3 - <<'PY'
          import json
          import subprocess
          expected = {
            "docs/heimdall-gemini-cloud-credits-20261008": "2db44922d6c9d1a02c8eb76cff24d2093ebcf2e5",
            "feat/android-knowledge-bridge": "ffa2165ed3fbe4acb02503711d50691a621a8588",
            "feat/corpus-forge-batch-001": "5dfdf77e4fbad513d24a37b5d4dbc35e2023c428",
            "feat/omega-termux-knowledge-connector": "f0ac5da8b9eb851b0fb745170bc9a0ecab0a9f20",
            "feat/phone-knowledge-mcp": "9b30a6e33ad6865e5f541b9e455b004393422dda",
            "feat/phone-knowledge-root-mcp": "6b2c51b55156aba50acf94337c8f833adfa4acd3",
            "feat/secure-mcp-tunnel-official": "eb9ab1c41a5fa8b51f26fd6f2ac7134484592954",
            "fix/android-bridge-live-status": "5c167a5d78606706710bf2cae1c67bcef3816b23",
            "sync/github-absolute-automation-v0.3.0-current": "0f328adaf5d1c3e14e22ba23267ad6fd8cdb4a9b",
            "sync/github-absolute-automation-v0.3.0-final": "9a995868f2a8ee5eb2e5b36add83b44b9cde5906",
            "sync/github-absolute-automation-v0.3.0": "0e337b029bbe04b6e56a536e40ef0ff7a1bb2308"
          }
          for branch, sha in sorted(expected.items()):
              ref = f"refs/remotes/origin/{branch}"
              observed = subprocess.check_output(["git", "rev-parse", ref], text=True).strip()
              if observed != sha:
                  raise AssertionError(f"Historical recovery branch changed: {branch}: {observed}")
              result = subprocess.run(["git", "merge-base", "--is-ancestor", sha, "HEAD"])
              if result.returncode:
                  raise AssertionError(f"Historical commit not in main ancestry: {branch}")
              print(f"PRESERVED {branch} {sha}")
          print(f"PASS: {len(expected)} historical recovery branches preserved; no delete permissions")
          PY
