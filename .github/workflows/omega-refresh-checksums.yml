name: OMEGA Refresh Checksums

on:
  push:
    branches: [main]
    paths:
      - "omega/**"
      - ".github/workflows/omega-refresh-checksums.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-refresh-checksums-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Sync release counts and rebuild SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path("omega")
          verification_path = root / "FINAL_VERIFICATION.json"
          verification = json.loads(verification_path.read_text(encoding="utf-8"))
          verification["counts"] = {
              "skills": len(list((root / "skills").glob("*/SKILL.md"))),
              "references": len(list((root / "references").glob("*.md"))),
              "schemas": len(list((root / "schemas").glob("*.json"))),
          }
          verification["verification_state"] = "awaiting_ci"
          verification["package_validator"] = "PENDING_CI"
          verification_path.write_text(
              json.dumps(verification, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          lines = []
          for path in sorted(
              p for p in root.rglob("*")
              if p.is_file() and p.name != "SHA256SUMS.txt"
          ):
              rel = path.relative_to(root).as_posix()
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {rel}")
          (root / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"counts={verification['counts']} checksums={len(lines)}")
          PY

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          pkg="$tmp/omega-omni-cognitive-engineering-v2"
          mkdir -p "$pkg"
          cp -a omega/. "$pkg/"
          python3 "$pkg/scripts/validate_package.py"

      - name: Commit synchronized release metadata to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "omega-checksum-bot"
          git config user.email "omega-checksum-bot@users.noreply.github.com"
          git add omega/FINAL_VERIFICATION.json omega/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Release metadata already current."
            exit 0
          fi
          git commit -m "chore(main): sync OMEGA release metadata"
          git push origin HEAD:main
