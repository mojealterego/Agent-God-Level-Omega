name: OMEGA THOR Lovable Real Agents
on:
  issues:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: omega-lovable-agents-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  ai-agents:
    if: github.repository == 'mojealterego/Agent-God-Level-Omega' && github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, '[THOR-LOVABLE] ') || startsWith(github.event.issue.title, '[THOR-BUILD] ') || startsWith(github.event.issue.title, '[THOR-PROJECT] '))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted agent source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test OIDC and inference adapter
        run: node --test tests/thor-copilot-worker.test.mjs tests/thor-lovable-agent.test.mjs tests/thor-autobuild.test.mjs tests/omega-project-factory.test.mjs tests/omega-project-agent.test.mjs tests/omega-project-gate.test.mjs
      - name: Execute live backend model stages using GitHub-signed OIDC
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OMEGA_AUTOBUILD: ${{ startsWith(github.event.issue.title, '[THOR-BUILD] ') }}
          OMEGA_PROJECT: ${{ startsWith(github.event.issue.title, '[THOR-PROJECT] ') }}
        run: |
          if [ "$OMEGA_PROJECT" = 'true' ]; then
            node scripts/omega-project-agent.mjs
          elif [ "$OMEGA_AUTOBUILD" = 'true' ]; then
            node scripts/thor-autobuild.mjs
          else
            node scripts/thor-lovable-agent.mjs
          fi

      - name: Configure JDK 17 for native Android
        if: startsWith(github.event.issue.title, '[THOR-PROJECT] android ')
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure pinned Gradle 8.9 for native Android
        if: startsWith(github.event.issue.title, '[THOR-PROJECT] android ')
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Native Android APK via Gradle and Android SDK 35
        if: startsWith(github.event.issue.title, '[THOR-PROJECT] android ')
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find experiments/omega-projects -path '*/app/src/main/AndroidManifest.xml' -type f)
          if [ "${#manifests[@]}" -ne 1 ]; then echo "Expected exactly one Android project in working tree" >&2; exit 1; fi
          root="${manifests[0]%/app/src/main/AndroidManifest.xml}"
          test -d "${ANDROID_HOME:?Android SDK missing}"
          if command -v sdkmanager >/dev/null; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
          gradle --no-daemon --console=plain -p "$root" assembleDebug
          test -s "$root/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p dist/android
          cp "$root/app/build/outputs/apk/debug/app-debug.apk" dist/android/omega-native-app-debug.apk
          (cd dist/android && sha256sum omega-native-app-debug.apk > SHA256SUMS.txt)
      - name: Publish verified native APK artifact
        if: startsWith(github.event.issue.title, '[THOR-PROJECT] android ')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-native-android-debug-apk
          path: dist/android/*
          if-no-files-found: error
          retention-days: 30
