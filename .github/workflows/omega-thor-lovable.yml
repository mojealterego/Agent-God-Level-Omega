name: OMEGA THOR Lovable Real Agents
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
  id-token: write
concurrency:
  group: omega-lovable-agents-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  ai-agents:
    if: github.repository == 'mojealterego/Agent-God-Level-Omega' && github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, '[THOR-LOVABLE] ') || startsWith(github.event.issue.title, '[THOR-BUILD] '))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted agent source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test OIDC and inference adapter
        run: node --test tests/thor-copilot-worker.test.mjs tests/thor-lovable-agent.test.mjs tests/thor-autobuild.test.mjs
      - name: Execute live backend model stages using GitHub-signed OIDC
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/thor-autobuild.mjs
