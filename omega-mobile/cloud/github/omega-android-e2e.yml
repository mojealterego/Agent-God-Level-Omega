name: OMEGA Android E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-quality-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OMEGA_ANDROID_MODULE: ${{ vars.OMEGA_ANDROID_MODULE || 'app' }}
      OMEGA_ANDROID_VARIANT: ${{ vars.OMEGA_ANDROID_VARIANT || 'release' }}
      OMEGA_ANDROID_TEST_VARIANT: ${{ vars.OMEGA_ANDROID_TEST_VARIANT || 'debug' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.OMEGA_JAVA_VERSION || '17' }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build, lint, unit-test, APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          python3 mobile/android/android_pipeline.py run \
            --module "$OMEGA_ANDROID_MODULE" \
            --variant "$OMEGA_ANDROID_VARIANT" \
            --test-variant "$OMEGA_ANDROID_TEST_VARIANT" \
            --e2e-mode none
      - name: Optional Gradle Managed Device E2E
        if: ${{ vars.OMEGA_ANDROID_MANAGED_TASK != '' }}
        shell: bash
        env:
          OMEGA_ANDROID_MANAGED_TASK: ${{ vars.OMEGA_ANDROID_MANAGED_TASK }}
        run: |
          set -euo pipefail
          python3 mobile/android/android_pipeline.py run \
            --module "$OMEGA_ANDROID_MODULE" \
            --variant "$OMEGA_ANDROID_VARIANT" \
            --test-variant "$OMEGA_ANDROID_TEST_VARIANT" \
            --e2e-mode managed \
            --managed-task "$OMEGA_ANDROID_MANAGED_TASK"
      - name: Emit artifact manifest
        run: python3 mobile/android/android_pipeline.py artifacts > omega-android-artifacts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omega-android-${{ github.sha }}
          if-no-files-found: error
          path: |
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.aab
            **/build/reports/**
            omega-android-artifacts.json
