name: OMEGA Google Play Release

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Android applicationId/package name
        required: true
        type: string
      track:
        description: Google Play track
        required: true
        default: internal
        type: string
      status:
        description: Release status
        required: true
        default: completed
        type: choice
        options:
          - draft
          - inProgress
          - halted
          - completed
      user_fraction:
        description: Fraction for inProgress staged rollout; leave empty otherwise
        required: false
        type: string
      commit:
        description: Commit the validated Google Play edit
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: google-play-${{ inputs.track }}
    env:
      GOOGLE_PLAY_PACKAGE: ${{ inputs.package_name }}
      GOOGLE_PLAY_TRACK: ${{ inputs.track }}
      GOOGLE_PLAY_STATUS: ${{ inputs.status }}
      GOOGLE_PLAY_USER_FRACTION: ${{ inputs.user_fraction }}
      GOOGLE_PLAY_COMMIT: ${{ inputs.commit }}
      OMEGA_ANDROID_MODULE: ${{ vars.OMEGA_ANDROID_MODULE || 'app' }}
      OMEGA_ANDROID_VARIANT: ${{ vars.OMEGA_ANDROID_VARIANT || 'release' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.OMEGA_JAVA_VERSION || '17' }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Authenticate to Google through Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
      - name: Build release AAB and APK
        shell: bash
        run: |
          set -euo pipefail
          python3 mobile/android/android_pipeline.py run \
            --module "$OMEGA_ANDROID_MODULE" \
            --variant "$OMEGA_ANDROID_VARIANT" \
            --e2e-mode none
      - name: Install Google Play API client
        run: python3 -m pip install --disable-pip-version-check -r cloud/google-play/requirements.txt
      - name: Validate or publish Google Play edit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find . -type f -path '*/build/outputs/*' -name '*.aab' -size +0c | sort)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "Expected exactly one AAB, found ${#bundles[@]}" >&2
            printf '%s\n' "${bundles[@]:-}" >&2
            exit 1
          fi
          args=(
            --package "$GOOGLE_PLAY_PACKAGE"
            --artifact "${bundles[0]}"
            --track "$GOOGLE_PLAY_TRACK"
            --status "$GOOGLE_PLAY_STATUS"
          )
          if [ -n "${GOOGLE_PLAY_USER_FRACTION:-}" ]; then
            args+=(--user-fraction "$GOOGLE_PLAY_USER_FRACTION")
          fi
          if [ "$GOOGLE_PLAY_COMMIT" = "true" ]; then
            args+=(--commit)
          fi
          if [ "$GOOGLE_PLAY_TRACK" = "production" ]; then
            args+=(--allow-production)
          fi
          python3 cloud/google-play/google_play_publisher.py "${args[@]}" | tee omega-google-play-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omega-google-play-${{ github.sha }}
          path: |
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.aab
            omega-google-play-result.json
