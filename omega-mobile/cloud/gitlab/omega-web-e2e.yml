omega:web:e2e:
  image: node:22-bookworm
  stage: test
  timeout: 45m
  variables:
    CI: "true"
  script:
    - |
      set -euo pipefail
      if [ -f pnpm-lock.yaml ]; then
        corepack enable
        pm=pnpm
        pnpm install --frozen-lockfile
      elif [ -f yarn.lock ]; then
        corepack enable
        pm=yarn
        yarn install --immutable
      else
        pm=npm
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
      fi
      node -e 'const p=require("./package.json"); for (const s of ["lint","typecheck","test","build"]) if (p.scripts?.[s]) console.log(s)' > /tmp/omega-scripts
      while read -r s; do "$pm" run "$s"; done < /tmp/omega-scripts
      if node -e 'const p=require("./package.json"); process.exit(p.scripts?.e2e?0:1)'; then "$pm" run e2e; fi
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
      - coverage/
      - dist/
    expire_in: 14 days
